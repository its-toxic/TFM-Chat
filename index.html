<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TFM Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth-screen" class="screen">
    <div class="card">
      <img src="logo.png" alt="TFM" class="logo">
      <h1>TFM Chat</h1>
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">دخول</button>
        <button class="auth-tab" data-mode="signup">حساب جديد</button>
      </div>
      <input id="email" type="email" placeholder="الإيميل" dir="ltr">
      <input id="password" type="password" placeholder="الباسورد" dir="ltr">
      <button id="auth-submit" class="primary">دخول</button>
      <button id="forgot-btn" class="link-btn">نسيت كلمة السر؟</button>
      <button id="contact-open" class="ghost">التواصل والشكاوي</button>
      <p id="auth-msg" class="msg-text"></p>
    </div>
  </div>

  <div id="recovery-screen" class="screen hidden">
    <div class="card">
      <h1>باسورد جديد</h1>
      <input id="new-password" type="password" placeholder="الباسورد الجديد" dir="ltr">
      <button id="recovery-btn" class="primary">حفظ الباسورد</button>
      <p id="rec-msg" class="msg-text"></p>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <header>
      <div class="user-box">
        <img id="my-avatar" class="avatar" src="" alt="" hidden>
        <span id="user-label" class="user-label"></span>
      </div>
      <button id="menu-toggle" class="ghost">☰</button>
      <div id="header-extra" class="header-extra">
        <button id="avatar-btn" class="ghost">تغيير الصورة</button>
        <button id="name-btn" class="ghost">تغيير الاسم</button>
        <div class="header-btns">
          <button id="search-btn" class="ghost">Search</button>
          <button id="history-btn" class="ghost">History</button>
          <button id="admin-toggle" class="ghost hidden">لوحة الأدمن</button>
          <button id="logout-btn" class="danger-btn">خروج</button>
        </div>
      </div>
    </header>

    <div id="search-bar" class="search-bar hidden">
      <input id="search-input" placeholder="ابحث في الرسايل..." dir="auto">
      <button id="search-close" class="ghost">✕</button>
    </div>

    <div id="messages"></div>

    <div class="composer">
      <input id="file-input" type="file" accept="image/*,video/*,application/pdf" hidden>
      <button id="attach-btn" class="ghost" title="إرفاق ملف">📎</button>
      <button id="cam-btn" class="ghost" title="كاميرا">📷</button>
      <button id="mic-btn" class="ghost" title="تسجيل صوت">🎙️</button>
      <input id="msg-input" placeholder="اكتب رسالة...">
      <button id="send-btn" class="primary">إرسال</button>
    </div>

    <div class="credits">Created by <b>Ahmed</b> &nbsp;|&nbsp; Designed by <b>Ahmed</b></div>

    <div id="admin-panel" class="admin-panel hidden">
      <h3>إدارة الأدوار</h3>
      <div id="users-list"></div>
    </div>
  </div>

  <div id="msg-menu" class="msg-menu hidden">
    <button id="menu-copy">نسخ</button>
    <button id="menu-search">بحث</button>
    <button id="menu-delete" class="danger">مسح</button>
  </div>

  <div id="history-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>History</h3>
        <button id="history-close" class="ghost">✕</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="links">Links</button>
        <button class="tab" data-tab="docs">Documents</button>
        <button class="tab" data-tab="media">Media</button>
      </div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="cam-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Camera</h3>
        <button id="cam-close" class="ghost">✕</button>
      </div>
      <video id="cam-video" autoplay playsinline></video>
      <canvas id="cam-canvas" hidden></canvas>
      <button id="cam-snap" class="primary">تصوير وإرسال</button>
    </div>
  </div>

  <div id="contact-modal" class="modal hidden">
    <div class="modal-box contact-box">
      <div class="modal-head">
        <h3>التواصل والشكاوي</h3>
        <button id="contact-close" class="ghost">✕</button>
      </div>
      <p>للتواصل أو تقديم الشكاوي:</p>
      <p class="contact-line">📞 010-325-12602</p>
      <p>الإيميل:</p>
      <p class="contact-line">its.toxic0807@gmail.com</p>
      <textarea id="contact-msg" placeholder="اكتب شكواك أو رسالتك هنا..."></textarea>
      <button id="contact-send" class="primary">إرسال عن طريق الإيميل</button>
    </div>
  </div>

  <input id="avatar-input" type="file" accept="image/*" hidden>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
